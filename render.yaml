# Render Blueprint for the Millwater PMS API.
# The frontend is deployed separately on Vercel (millwater-pms-frontend).
services:
  - type: web
    name: millwater-pms-api
    runtime: node
    plan: free
    buildCommand: npm ci
    # Applies pending database migrations, then starts the API.
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: millwater-pms-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://millwater-pms.vercel.app
      - key: MILLWATER_BOOTSTRAP_KEY
        generateValue: true
      # Loads demonstration data (network, customers, 3 months of billing history) on startup.
      # Set to "false" before entering real data.
      - key: SEED_DEMO_DATA
        value: "true"
      # Encrypts secrets entered in Settings (AMI token). Never change it once set.
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      # Onboarding emails. "mailtrap" for demos (caught in the Mailtrap sandbox inbox, never
      # delivered); switch to "resend" once the client's domain is verified in Resend.
      - key: EMAIL_PROVIDER
        value: mailtrap
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_INBOX_ID
        sync: false
      # For Resend: EMAIL_FROM must be on the verified domain, e.g. "Millwater <onboarding@millwater.ng>".
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: millwater-pms-db
    plan: free
    databaseName: millwater_pms
